name: Deploy URL Merger to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run merger unit tests
        run: node --test tests/*.test.cjs

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate site entry point
        run: test -s index.html
      - name: Generate deployed version and Service Worker
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          # Only app-facing changes change the deployed version.
          revision = subprocess.check_output(
              ["git", "log", "-1", "--format=%H", "--", "index.html",
               "manifest.webmanifest", "sw.js", "merger.js", "translation.js",
               "about.html", "style.css",
               "assets/", "version.json"],
              text=True
          ).strip()
          if not revision:
              raise SystemExit("No application revision found")
          version_file = pathlib.Path("version.json")
          config = json.loads(version_file.read_text(encoding="utf-8"))
          if (not isinstance(config, dict) or
              any(type(config.get(key)) is not int or config[key] < 0
                  for key in ("major", "minor"))):
              raise SystemExit("version.json must contain nonnegative integer major and minor")
          build = revision[:12]
          full_version = f'{config["major"]}.{config["minor"]}.0+{build}'
          version_file.write_text(
              json.dumps({**config, "build": build, "version": full_version}, indent=2) + "\n",
              encoding="utf-8"
          )
          sw = pathlib.Path("sw.js")
          source = sw.read_text(encoding="utf-8")
          if "__APP_VERSION__" not in source:
              raise SystemExit("Missing Service Worker version placeholder")
          sw.write_text(source.replace("__APP_VERSION__", full_version),
                        encoding="utf-8")
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
